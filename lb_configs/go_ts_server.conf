# ─── Go xc_ts_server integration for nginx ────────────────────────────
#
# Include this file in your nginx server block to enable Go delivery.
# The Go server must be running on 127.0.0.1:8089 (default).
#
# Two integration modes:
#
#   MODE A — Native auth (Go replaces PHP entirely for live streams):
#     Uncomment the /auth/ and /hls/ rewrite overrides below.
#     Go handles: token decryption, auth, connection tracking, enforcement,
#     on-demand start, HLS playlist generation, segment delivery, heartbeat.
#     PHP is completely bypassed for live TS/HLS requests.
#     This is the primary/recommended mode for all nodes (MAIN and LB).
#
#   MODE B — PHP auth + Go delivery (X-Accel handoff):
#     Used primarily for VOD (vod.php has direct-proxy and transcoding logic
#     that Go doesn't replicate). Also available as a fallback for live
#     streams if Mode A is not configured.
#     PHP handles auth/enforcement, then X-Accel-Redirects to Go for
#     efficient byte delivery (file serving, Range support).
#
# Both modes can coexist: use native auth for live/HLS, X-Accel for VOD.
#
# Usage:
#   include go_ts_server.conf;
#
# ──────────────────────────────────────────────────────────────────────

# ─── Go upstream ─────────────────────────────────────────────────────
# upstream go_ts_server {
#     server 127.0.0.1:8089;
#     keepalive 64;
# }

# ─── MODE A: Native auth override ────────────────────────────────────
# Uncomment to route /auth/<token> directly to Go (bypasses PHP entirely).
# Go does its own token decryption, auth, tracking, enforcement, delivery.
#
# WARNING: This replaces the full PHP live pipeline. Make sure the Go server is configured
# with -live-streaming-pass and -openssl-extra matching your XC_VM settings.
#
# location ~ ^/auth/seg/(.+)$ {
#     limit_req zone=one burst=8;
#     proxy_pass http://127.0.0.1:8089;
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_buffering off;
#     proxy_read_timeout 30s;
# }
#
# location ~ ^/auth/(.+)$ {
#     limit_req zone=one burst=8;
#     proxy_pass http://127.0.0.1:8089;
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_buffering off;
#     proxy_read_timeout 3600s;
#     proxy_send_timeout 3600s;
# }

# ─── MODE B: Internal X-Accel locations (PHP auth → Go delivery) ────
# Primarily used for VOD. Also available as fallback for live TS/HLS
# if Mode A is not configured. These are internal-only: nginx serves
# them only via X-Accel-Redirect headers sent by PHP (live.php, vod.php).
# Clients cannot reach them directly.

# TS delivery: fallback for live TS when Mode A is not active
# X-Accel-Redirect from live.php: /xc_ts_go/<stream_id>?uuid=U&prebuffer=P
location /xc_ts_go/ {
    internal;
    add_header Access-Control-Allow-Origin * always;
    rewrite ^/xc_ts_go/(.*)$ /ts/$1 break;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# HLS playlist: fallback for HLS when Mode A is not active
# X-Accel-Redirect from live.php: /xc_hls_go/<stream_id>?uuid=U
location /xc_hls_go/ {
    internal;
    add_header Access-Control-Allow-Origin * always;
    rewrite ^/xc_hls_go/(.*)$ /hls_playlist/$1 break;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 30s;
}

# HLS segment delivery via Go (when Go does native auth)
# Segment URLs in Go-generated m3u8 point to /auth/seg/<file>?uuid=U
# This location is only needed in MODE A (native auth)
# location /xc_hls_seg/ {
#     internal;
#     add_header Access-Control-Allow-Origin * always;
#     rewrite ^/xc_hls_seg/(.*)$ /auth/seg/$1 break;
#     proxy_pass http://127.0.0.1:8089;
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# }

# VOD file delivery: PHP auth → Go serves file with Range/seek (primary VOD mode)
# X-Accel-Redirect from vod.php: /xc_vod_go/<stream_id>?uuid=U&ext=E
location /xc_vod_go/ {
    internal;
    add_header Access-Control-Allow-Origin * always;
    rewrite ^/xc_vod_go/(.*)$ /vod_serve/$1 break;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

