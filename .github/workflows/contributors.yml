name: Update contributors list

# Regenerates the avatar table between the `readme: contributors` markers in
# CONTRIBUTORS.md from the GitHub contributors API (Bot-type accounts are
# filtered out by the action itself).
#
# main is protected (required reviews + status checks). With the default
# GITHUB_TOKEN the action falls back to opening a PR, and PRs created by
# GITHUB_TOKEN do not trigger workflows, so the required checks never run.
# Set the CONTRIBUTORS_TOKEN secret to a PAT of a repo admin (fine-grained,
# Contents: read & write on this repo): admins are not bound by the
# protection rules (enforce_admins is off), so the action commits directly.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  contributors:
    name: Update CONTRIBUTORS.md
    if: github.repository == 'Vateron-Media/XC_VM'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA: this third-party action receives an admin PAT
      # that bypasses branch protection, so a moved tag must not change the code.
      - uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f # v2.3.11
        with:
          readme_path: CONTRIBUTORS.md
          use_username: true
          image_size: 80
          columns_per_row: 7
          commit_message: 'docs(contributors): update contributors list'
          auto_detect_branch_protection: ${{ secrets.CONTRIBUTORS_TOKEN == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN || secrets.GITHUB_TOKEN }}
