# ─── Go xc_ts_server integration for nginx ────────────────────────────
#
# Include this file in your nginx server block to enable Go delivery.
# The Go server must be running on 127.0.0.1:8089 (default).
#
# Go handles the full pipeline for live streams (TS/HLS):
#   token decryption, auth, connection tracking, enforcement,
#   on-demand start, delivery, heartbeat, lifecycle.
#
# If Go is not running (502/503/504), nginx automatically falls back
# to PHP via @go_auth_fallback — so PHP handles everything as before.
#
# VOD always goes through PHP first (auth + enforcement), then
# X-Accel-Redirects to Go for efficient file serving with Range support.
#
# Usage:
#   1. Comment out the /auth/ rewrite in your nginx.conf:
#        # rewrite ^/auth/(?<token>[^/]*)$ /stream/live?token=$token break;
#   2. Add: include go_ts_server.conf;
#   3. nginx -t && nginx -s reload
#
# IMPORTANT: The /auth/ rewrite in nginx.conf MUST be commented out,
# otherwise nginx rewrites the URL before Go can handle it.
#
# ──────────────────────────────────────────────────────────────────────

# ─── Go handles /auth/<token> (full pipeline: auth + delivery) ───────
# Go decrypts the token, validates the user, creates/updates lines_live,
# enforces max_connections, starts on-demand if needed, and serves the
# stream (TS or HLS). If Go is down, falls back to PHP automatically.

location ~ ^/auth/seg/(.+)$ {
    limit_req zone=one burst=8;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_connect_timeout 2s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @go_seg_fallback;
}

location ~ ^/auth/(?<go_token>.+)$ {
    limit_req zone=one burst=8;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 2s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @go_auth_fallback;
}

# ─── PHP fallback when Go is down ────────────────────────────────────
# If Go returns 502/503/504 (not running or crashed), nginx retries
# the request through PHP. The `last` flag restarts location matching,
# hitting the PHP handler (try_files → @extensionless-php → fastcgi).

location @go_auth_fallback {
    rewrite ^ /stream/live?token=$go_token last;
}

location @go_seg_fallback {
    # HLS segments have no PHP equivalent — return 503 (Go required)
    return 503 "Go TS server unavailable for HLS segments";
}

# ─── Internal X-Accel locations (PHP auth → Go delivery) ────────────
# Used for VOD (PHP auth → Go file serving). Also used for live TS/HLS
# as a secondary path when PHP handles auth (e.g. in live.php X-Accel blocks).

# TS delivery via X-Accel (secondary path from live.php)
# X-Accel-Redirect from live.php: /xc_ts_go/<stream_id>?uuid=U&prebuffer=P
location /xc_ts_go/ {
    internal;
    add_header Access-Control-Allow-Origin * always;
    rewrite ^/xc_ts_go/(.*)$ /ts/$1 break;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# HLS playlist via X-Accel (secondary path from live.php)
# X-Accel-Redirect from live.php: /xc_hls_go/<stream_id>?uuid=U
location /xc_hls_go/ {
    internal;
    add_header Access-Control-Allow-Origin * always;
    rewrite ^/xc_hls_go/(.*)$ /hls_playlist/$1 break;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 30s;
}

# VOD file delivery: PHP auth → Go serves file with Range/seek
# X-Accel-Redirect from vod.php: /xc_vod_go/<stream_id>?uuid=U&ext=E
location /xc_vod_go/ {
    internal;
    add_header Access-Control-Allow-Origin * always;
    rewrite ^/xc_vod_go/(.*)$ /vod_serve/$1 break;
    proxy_pass http://127.0.0.1:8089;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

