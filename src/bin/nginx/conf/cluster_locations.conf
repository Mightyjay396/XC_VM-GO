# Generated by XC_VM (ClusterNginxConfig): the cluster API, included by the
# public server{} and by the servers in cluster.d/. MAIN only. Do not edit.
# Control ops (the agent's poll and ctl lanes) run on the cluster_ctl pool,
# ingest ops (its p0 and bulk lanes) on cluster_ingest; the nested location
# inherits the rest. nginx's own 429, 413, 502, 504 and 404 carry no MAC:
# agents treat them as transport errors.
location ^~ /cluster/v1/ {
    limit_req zone=cluster burst=400 nodelay;
    limit_req_status 429;
    client_max_body_size 8m;
    gzip off;
    fastcgi_pass cluster_ctl;
    include fastcgi_params;
    fastcgi_buffering on;
    fastcgi_keep_conn on;
    fastcgi_param SCRIPT_FILENAME /home/xc_vm/Public/cluster/index.php;
    fastcgi_param SCRIPT_NAME /public/cluster/index.php;

    location ~ ^/cluster/v1/(events|config|streams|conn_snapshot|stream_bundle|rpc_result|recording_complete|vod_analysis|queue_claim|queue_update|queue_enqueue|artefact)$ {
        fastcgi_pass cluster_ingest;
    }
}
