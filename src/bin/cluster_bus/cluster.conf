# The cluster bus (Domain\Cluster\ClusterBus): MAIN's own Redis for the
# cluster API, reachable only through its unix socket. Nothing in it must
# survive a restart, so it is never persisted.
port 0
unixsocket /home/xc_vm/bin/cluster_bus/cluster.sock
unixsocketperm 700
daemonize yes
supervised no
pidfile /home/xc_vm/bin/cluster_bus/cluster.pid
loglevel warning
logfile /home/xc_vm/bin/cluster_bus/cluster.log
dir /home/xc_vm/bin/cluster_bus/
databases 1
save ""
appendonly no
maxclients 10000
maxmemory 256mb
maxmemory-policy volatile-ttl
timeout 0
tcp-keepalive 0
rename-command CONFIG ""
rename-command DEBUG ""
rename-command SHUTDOWN ""
rename-command SLAVEOF ""
rename-command REPLICAOF ""
rename-command MIGRATE ""
rename-command MODULE ""
